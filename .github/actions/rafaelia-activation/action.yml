name: RAFAELIA Activation
description: Activates RAFAELIA by reading ativar.txt from multiple locations. Requires bash to be available on the runner (e.g., Git Bash on Windows).
runs:
  using: "composite"
  steps:
    - name: Check for bash availability
      shell: bash
      run: |
        if ! command -v bash >/dev/null 2>&1; then
          echo "Error: bash is required for this action but was not found on the runner."
          exit 1
        fi
        echo "Bash is available on the runner"

    - name: Prepare logs directory
      shell: bash
      run: |
        if ! mkdir -p out/logs; then
          echo "Error: Failed to create logs directory at out/logs"
          exit 1
        fi
        echo "Logs directory created for ativar excerpt"

    - name: Activate RAFAELIA (ativar.txt)
      shell: bash
      run: |
        echo "=========================================="
        echo "RAFAELIA Activation - Reading ativar.txt"
        echo "=========================================="

        EXCERPT_LINES=10
        ATIVAR_FOUND=false
        ATIVAR_PATH=""

        # Check for ZIPRAF_OMEGA_FULL/ativar.txt
        if [ -f "ZIPRAF_OMEGA_FULL/ativar.txt" ]; then
          echo "Found ativar.txt in ZIPRAF_OMEGA_FULL directory"
          ATIVAR_PATH="ZIPRAF_OMEGA_FULL/ativar.txt"
          ATIVAR_FOUND=true
        # Check for ativar.txt at repo root
        elif [ -f "ativar.txt" ]; then
          echo "Found ativar.txt at repository root"
          ATIVAR_PATH="ativar.txt"
          ATIVAR_FOUND=true
        # Check for the file with spaces in name (fallback for existing setup)
        elif [ -f "ZIPRAF_OMEGA_FULL DO it ativar.txt" ]; then
          echo "Found 'ZIPRAF_OMEGA_FULL DO it ativar.txt' at repository root"
          ATIVAR_PATH="ZIPRAF_OMEGA_FULL DO it ativar.txt"
          ATIVAR_FOUND=true
        fi

        if [ "$ATIVAR_FOUND" = true ]; then
          # Check if file is readable
          if [ ! -r "$ATIVAR_PATH" ]; then
            echo "Error: Found ativar.txt at '$ATIVAR_PATH' but it is not readable (check file permissions)"
            exit 1
          fi

          # Read and display the file
          if ! cat "$ATIVAR_PATH"; then
            echo "Error: Failed to read ativar.txt from '$ATIVAR_PATH'"
            exit 1
          fi

          # Create excerpt for logs
          if ! head -n "$EXCERPT_LINES" "$ATIVAR_PATH" > out/logs/ativar_excerpt.txt; then
            echo "Error: Failed to create excerpt file at out/logs/ativar_excerpt.txt"
            exit 1
          fi
        else
          echo "No ativar.txt file found (checked ZIPRAF_OMEGA_FULL/ativar.txt, ativar.txt, and legacy path)"
          echo "No ativar.txt file found" > out/logs/ativar_excerpt.txt
        fi

        echo "=========================================="
        echo "RAFAELIA activation marker processed"
