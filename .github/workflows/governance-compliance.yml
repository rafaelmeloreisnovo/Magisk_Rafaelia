name: Governance Compliance Check

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  compliance-check:
    name: Standards Compliance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests
      
      - name: Run Governance Compliance Check
        id: compliance
        run: |
          echo "Running compliance check..."
          python3 tools/governance_compliance_checker.py \
            --root . \
            --report compliance_report.json || true
          
          # Extract compliance rate
          COMPLIANCE_RATE=$(python3 -c "import json; data=json.load(open('compliance_report.json')); print(f\"{data['summary']['compliance_rate']:.2f}\")")
          echo "compliance_rate=$COMPLIANCE_RATE" >> $GITHUB_OUTPUT
          
          # Check if compliance is acceptable (>= 75%)
          if (( $(echo "$COMPLIANCE_RATE >= 75.0" | bc -l) )); then
            echo "compliance_status=PASS" >> $GITHUB_OUTPUT
          else
            echo "compliance_status=FAIL" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload compliance report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: compliance-report
          path: compliance_report.json
          retention-days: 30
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('compliance_report.json', 'utf8'));
            
            const complianceRate = report.summary.compliance_rate.toFixed(2);
            const status = parseFloat(complianceRate) >= 75.0 ? '✅ PASS' : '❌ FAIL';
            const statusEmoji = parseFloat(complianceRate) >= 90 ? '🌟' : 
                               parseFloat(complianceRate) >= 75 ? '✅' :
                               parseFloat(complianceRate) >= 60 ? '⚠️' : '❌';
            
            const body = `
            ## ${statusEmoji} Governance Compliance Report
            
            **Status:** ${status}
            **Compliance Rate:** ${complianceRate}%
            
            ### Standards Applied
            - ISO/IEC 27001, 9126, 25010
            - IEEE 730, 828, 829, 1012
            - NIST SP 800-53
            - W3C Web Standards
            - ABNT NBR ISO/IEC Standards
            - RAFAELIA Framework
            
            ### Summary
            - ✅ **Passed:** ${report.summary.passed}
            - ⚠️ **Warnings:** ${report.summary.warnings}
            - ❌ **Violations:** ${report.summary.violations}
            - 📊 **Total Checks:** ${report.summary.total_checks}
            
            ### Top Violations
            ${report.violations.slice(0, 5).map(v => 
              `- **${v.category}**: ${v.issue} (${v.file})`
            ).join('\n')}
            
            ${report.violations.length > 5 ? `\n_... and ${report.violations.length - 5} more violations_` : ''}
            
            ### Recommendations
            ${parseFloat(complianceRate) < 75 ? 
              '⚠️ This PR does not meet the minimum 75% compliance threshold. Please address the violations before merging.' :
              '✅ This PR meets the governance compliance requirements.'}
            
            📄 [Download full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Check compliance threshold
        run: |
          COMPLIANCE_RATE=${{ steps.compliance.outputs.compliance_rate }}
          echo "Compliance Rate: $COMPLIANCE_RATE%"
          
          if (( $(echo "$COMPLIANCE_RATE < 75.0" | bc -l) )); then
            echo "::warning::Compliance rate ($COMPLIANCE_RATE%) is below the required threshold (75%)"
            echo "::error::Governance compliance check FAILED. Please address the violations."
            # Note: We don't exit 1 here to allow the workflow to complete
            # and upload the report. Adjust based on your enforcement policy.
          else
            echo "::notice::Compliance check PASSED ($COMPLIANCE_RATE%)"
          fi
      
      - name: Create compliance badge
        run: |
          COMPLIANCE_RATE=${{ steps.compliance.outputs.compliance_rate }}
          
          # Determine badge color
          if (( $(echo "$COMPLIANCE_RATE >= 90.0" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COMPLIANCE_RATE >= 75.0" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COMPLIANCE_RATE >= 60.0" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          
          echo "Badge: ![Compliance](https://img.shields.io/badge/Compliance-$COMPLIANCE_RATE%25-$COLOR)"
          echo "BADGE_URL=https://img.shields.io/badge/Compliance-$COMPLIANCE_RATE%25-$COLOR" >> $GITHUB_ENV
