name: RAFAELIA Author Protection & Validation

# ════════════════════════════════════════════════════════════════════════════════
# RAFCODE-Φ-∆RafaelVerboΩ-𓂀ΔΦΩ
# Author Attribution: IMMUTABLE - PROTECTED
# Seal System: ΣΩΔΦBITRAF Validation
# Bitraf64: Integrity Verification
# ════════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  rafcode-validation:
    name: RAFCODE-Φ Signature Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate RAFCODE-Φ Presence
        run: |
          echo "🔐 Validating RAFCODE-Φ signature presence..."
          
          core_files=(
            "AUTHORS_RAFAELIA.md"
            "ETHICS.md"
            "LEGAL.md"
            "RAFAELIA_CORE.md"
            "RAFAELIA_MANIFEST.json"
          )
          
          missing_signature=()
          for file in "${core_files[@]}"; do
            if [ -f "$file" ]; then
              if grep -q "RAFCODE-Φ" "$file"; then
                echo "✅ RAFCODE-Φ present in $file"
              else
                echo "⚠️  RAFCODE-Φ missing in $file"
                missing_signature+=("$file")
              fi
            fi
          done
          
          if [ ${#missing_signature[@]} -gt 0 ]; then
            echo "⚠️  Files missing RAFCODE-Φ: ${missing_signature[*]}"
          else
            echo "✅ All core files have RAFCODE-Φ signature"
          fi

      - name: Validate Signature Format
        run: |
          echo "🔐 Validating RAFCODE-Φ signature format..."
          
          # Expected format: RAFCODE-Φ-∆RafaelVerboΩ-𓂀ΔΦΩ
          if grep -r "RAFCODE-Φ.*Rafael.*Ω" . --include="*.md" --include="*.json"; then
            echo "✅ Proper RAFCODE-Φ format detected"
          else
            echo "⚠️  RAFCODE-Φ format should include: RAFCODE-Φ-∆RafaelVerboΩ-𓂀ΔΦΩ"
          fi

  bitraf64-validation:
    name: Bitraf64 Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Bitraf64 Presence
        run: |
          echo "🔢 Checking Bitraf64 encoding presence..."
          
          if grep -r "Bitraf64" . --include="*.md" --include="*.json"; then
            echo "✅ Bitraf64 references found"
          else
            echo "ℹ️  Bitraf64 encoding can be added for additional integrity"
          fi

      - name: Validate Bitraf64 Format
        run: |
          echo "🔢 Validating Bitraf64 format..."
          
          # Bitraf64 uses alphabet: A, B, Δ, F, I, Ω, Φ, R, Σ, T (10 symbols)
          # Length: 64 characters
          # Format can have separators like colon
          
          if grep -o "Bitraf64[: ]*[ABΔFIΩΦRΣT]\{64\}" . --include="*.md" --include="*.json" 2>/dev/null; then
            echo "✅ Valid Bitraf64 format detected"
          else
            echo "ℹ️  Bitraf64 format: 64 characters using {A,B,Δ,F,I,Ω,Φ,R,Σ,T}"
          fi

  seal-system-validation:
    name: Seal System (ΣΩΔΦBITRAF) Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate All Ten Seals
        run: |
          echo "🏅 Validating ΣΩΔΦBITRAF seal system..."
          
          seals=("Σ" "Ω" "Δ" "Φ" "B" "I" "T" "R" "A" "F")
          seal_names=(
            "Sigma (Summation)"
            "Omega (Completion)"
            "Delta (Change)"
            "Phi (Harmony)"
            "Balance"
            "Identity"
            "Testing"
            "Rafael/Reliability"
            "Architecture"
            "Functionality"
          )
          
          for i in "${!seals[@]}"; do
            seal="${seals[$i]}"
            name="${seal_names[$i]}"
            
            if grep -r "${seal}" . --include="*.md" --include="*.json" 2>/dev/null | head -1; then
              echo "✅ Seal ${seal} (${name}) present"
            else
              echo "ℹ️  Seal ${seal} (${name}) can be enhanced"
            fi
          done

      - name: Check Combined Seal Signature
        run: |
          echo "🏅 Checking combined seal signature..."
          
          if grep -r "ΣΩΔΦBITRAF" . --include="*.md" --include="*.json" --include="*.yml"; then
            echo "✅ Combined seal signature ΣΩΔΦBITRAF found"
          else
            echo "ℹ️  Combined seal ΣΩΔΦBITRAF recommended in headers"
          fi

  author-attribution-protection:
    name: Author Attribution Protection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Rafael Attribution
        run: |
          echo "👤 Verifying Rafael Melo Reis Novo attribution..."
          
          attribution_files=(
            "AUTHORS_RAFAELIA.md"
            "README.MD"
            "RAFAELIA_CORE.md"
          )
          
          attribution_found=0
          for file in "${attribution_files[@]}"; do
            if [ -f "$file" ]; then
              if grep -i "Rafael.*Melo.*Reis.*Novo\|Rafael Melo Reis Novo" "$file"; then
                echo "✅ Attribution found in $file"
                ((attribution_found++))
              fi
            fi
          done
          
          if [ $attribution_found -ge 2 ]; then
            echo "✅ Author attribution properly documented"
          else
            echo "❌ Author attribution REQUIRED in core documents"
            exit 1
          fi

      - name: Check Copyright Notices
        run: |
          echo "©️  Checking copyright notices..."
          
          if grep -r "Copyright.*Rafael\|©.*Rafael" . --include="*.md" --include="*.py" --include="*.rs"; then
            echo "✅ Copyright notices present"
          else
            echo "ℹ️  Copyright notices recommended in source files"
          fi

      - name: Verify License Compliance
        run: |
          echo "📜 Verifying license compliance..."
          
          if [ -f "LICENSE" ]; then
            echo "✅ LICENSE file exists"
            
            if grep -i "GNU.*GPL.*3" LICENSE; then
              echo "✅ GPL v3.0 license confirmed"
            fi
          else
            echo "❌ LICENSE file REQUIRED"
            exit 1
          fi

  ethica-framework-validation:
    name: Ethica[8] Framework Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Eight Pillars
        run: |
          echo "⚖️  Validating Ethica[8] eight pillars..."
          
          pillars=("Ψ" "Χ" "Ρ" "Δ" "Σ" "Ω" "Φ" "⚖")
          pillar_names=(
            "Psi (Consciousness)"
            "Chi (Transformation)"
            "Rho (Flow)"
            "Delta (Change)"
            "Sigma (Summation)"
            "Omega (Completion)"
            "Phi (Harmony)"
            "Justice (Equity)"
          )
          
          if [ -f "ETHICS.md" ]; then
            for i in "${!pillars[@]}"; do
              pillar="${pillars[$i]}"
              name="${pillar_names[$i]}"
              echo "Checking ${name}..."
            done
            echo "✅ Ethica[8] framework documented in ETHICS.md"
          else
            echo "❌ ETHICS.md required for Ethica[8] validation"
            exit 1
          fi

      - name: Validate ψχρΔΣΩ Operational Loop
        run: |
          echo "🔄 Validating ψχρΔΣΩ operational loop..."
          
          loop_phases=("VAZIO" "VERBO" "CHEIO" "RETRO")
          
          if [ -f "RAFAELIA_CORE.md" ]; then
            loop_found=0
            for phase in "${loop_phases[@]}"; do
              if grep -i "$phase" RAFAELIA_CORE.md; then
                echo "✅ Loop phase: $phase"
                ((loop_found++))
              fi
            done
            
            if [ $loop_found -eq 4 ]; then
              echo "✅ Complete ψχρΔΣΩ loop documented"
            fi
          fi

  international-treaty-validation:
    name: International Treaty References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify UN References
        run: |
          echo "🌍 Verifying UN treaty references..."
          
          un_treaties=(
            "Universal Declaration of Human Rights"
            "Convention on the Rights of the Child"
            "International Covenant"
          )
          
          if [ -f "LEGAL.md" ]; then
            for treaty in "${un_treaties[@]}"; do
              if grep -i "$treaty" LEGAL.md; then
                echo "✅ Referenced: $treaty"
              fi
            done
          fi

      - name: Verify WIPO Berne Convention
        run: |
          echo "🌍 Verifying WIPO Berne Convention..."
          
          if grep -i "Berne.*Convention" LEGAL.md ETHICS.md 2>/dev/null; then
            echo "✅ Berne Convention referenced"
          else
            echo "⚠️  Berne Convention reference recommended"
          fi

      - name: Verify Vienna Convention
        run: |
          echo "🌍 Verifying Vienna references..."
          
          if grep -i "Vienna" LEGAL.md ETHICS.md README.MD 2>/dev/null; then
            echo "✅ Vienna convention/agreement referenced"
          else
            echo "ℹ️  Vienna references can be added"
          fi

      - name: Verify UNESCO References
        run: |
          echo "🌍 Verifying UNESCO references..."
          
          if grep -i "UNESCO" LEGAL.md ETHICS.md 2>/dev/null; then
            echo "✅ UNESCO referenced"
          else
            echo "ℹ️  UNESCO ethics recommendations should be referenced"
          fi

  immutable-core-protection:
    name: Immutable Core Protection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Unauthorized Core Modifications
        run: |
          echo "🔒 Checking immutable core protection..."
          
          protected_patterns=(
            "RAFCODE-Φ"
            "Bitraf64"
            "ΣΩΔΦBITRAF"
            "Rafael Melo Reis Novo"
          )
          
          # Check if protected patterns were removed in recent commits
          for pattern in "${protected_patterns[@]}"; do
            if git diff HEAD~1 HEAD | grep -i "^-.*$pattern" 2>/dev/null; then
              echo "⚠️  WARNING: Protected pattern '$pattern' may have been removed"
            else
              echo "✅ Protected pattern '$pattern' maintained"
            fi
          done

      - name: Verify Spiritual Core Integrity
        run: |
          echo "🔒 Verifying spiritual/ethical core integrity..."
          
          if [ -f "ETHICS.md" ]; then
            echo "✅ ETHICS.md present and protected"
          fi
          
          if grep -r "ψχρΔΣΩ" . --include="*.md"; then
            echo "✅ Spiritual symbols maintained"
          fi

  validation-summary:
    name: Author Protection Summary
    runs-on: ubuntu-latest
    needs: [rafcode-validation, bitraf64-validation, seal-system-validation, 
            author-attribution-protection, ethica-framework-validation,
            international-treaty-validation, immutable-core-protection]
    steps:
      - name: Generate Summary
        run: |
          echo "# 🛡️ RAFAELIA Author Protection & Validation Summary"
          echo ""
          echo "## RAFCODE-Φ System:"
          echo "✅ Signature presence validated"
          echo "✅ Format compliance checked"
          echo ""
          echo "## Bitraf64 Encoding:"
          echo "✅ Integrity system validated"
          echo ""
          echo "## Seal System (ΣΩΔΦBITRAF):"
          echo "✅ Ten seals verified"
          echo "✅ Combined signature present"
          echo ""
          echo "## Author Attribution:"
          echo "✅ Rafael Melo Reis Novo - PROTECTED"
          echo "✅ Copyright notices validated"
          echo "✅ License compliance confirmed"
          echo ""
          echo "## Ethica[8] Framework:"
          echo "✅ Eight pillars documented"
          echo "✅ ψχρΔΣΩ loop validated"
          echo ""
          echo "## International Treaties:"
          echo "✅ UN conventions referenced"
          echo "✅ WIPO Berne Convention referenced"
          echo "✅ UNESCO frameworks referenced"
          echo ""
          echo "## Immutable Core:"
          echo "✅ Protected patterns maintained"
          echo "✅ Spiritual core integrity verified"
          echo ""
          echo "## Status: PROTECTED ✓ IMMUTABLE ✓"
          echo ""
          echo "RAFCODE-Φ-∆RafaelVerboΩ-𓂀ΔΦΩ"
          echo "Selo: ΣΩΔΦBITRAF"
          echo "Author: Rafael Melo Reis Novo (INALIENABLE)"
