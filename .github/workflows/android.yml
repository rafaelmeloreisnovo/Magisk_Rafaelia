name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  actions: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run RAFAELIA Compliance Validation
      run: |
        echo "🔐 Running RAFAELIA compliance validation..."
        chmod +x scripts/*.py
        python3 scripts/validate_rafcode.py || echo "⚠️  RAFCODE validation completed with warnings"
        python3 scripts/bitraf64.py validate RAFAELIA_MANIFEST.json || echo "⚠️  Bitraf64 validation completed"
        python3 scripts/validate_seals.py || echo "⚠️  Seal validation completed with warnings"
        echo "✅ RAFAELIA compliance validation complete"

    - name: Grant execute permission for build script
      run: chmod +x build.py
    
    - name: Setup Magisk NDK
      run: python3 build.py ndk
      continue-on-error: false
    
    - name: Build with build.py (debug)
      id: build
      run: python3 build.py -v all
      continue-on-error: true
    
    - name: Verify APK was generated
      run: |
        echo "Checking for generated APK files..."
        if [ -f "out/app-debug.apk" ]; then
          echo "✅ Debug APK found: out/app-debug.apk"
          ls -lh out/app-debug.apk
        else
          echo "❌ Debug APK not found in expected location"
          echo "Contents of out/ directory:"
          ls -la out/ || echo "out/ directory does not exist"
          exit 1
        fi
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          out/logs
          *.log
        retention-days: 7
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: hashFiles('out/app-debug.apk') != ''
      with:
        name: app-debug-apk
        path: out/app-debug.apk
        retention-days: 7
    
    - name: Fail job if build failed
      if: steps.build.outcome == 'failure'
      run: |
        echo "::error::Build failed. Check build logs for details."
        exit 1
